# Territory HQ — Netlify site (package directory: repository root).
# Official monorepo guidance: base stays at repo root; each site gets its own
# netlify.toml in its package directory. Paths below are relative to base.
"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  # Netlify installs root dependencies (adapters) before this command.
  command = "npm --prefix api install --no-audit --no-fund && npm --prefix web install --no-audit --no-fund && npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "postgres"]
  included_files = ["node_modules/**"]

# API rules must stay before the SPA fallback so no /api path serves index.html.
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/hq-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/hq-api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Static files get these from Netlify; function responses get them from
# api/src/security-headers.js (Netlify custom headers do not apply to functions).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://data.ny.gov https://nominatim.openstreetmap.org https://router.project-osrm.org https://maps.googleapis.com; media-src 'self' blob:; worker-src 'self' blob:"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
